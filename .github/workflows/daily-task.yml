name: Scrape and save CSV

on:
  workflow_dispatch:
  schedule:
    # Runs every Monday at 3h UTC
    - cron: '0 3 * * 1'

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          mkdir -p data
          python main.py
          cp "$(ls -t data/metacritic_must_play_*.csv | head -1)" data/latest.csv

      - name: Update README with stats
        run: python meta.py

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Commit and push CSV and README
        run: |
          git add data/ README.md
          if git status --porcelain | grep .; then
            git commit -m "🔄 Auto-update CSV and README [skip ci]"
            git push
          else
            echo "No changes detected. Nothing to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}